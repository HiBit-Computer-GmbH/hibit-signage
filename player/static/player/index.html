<!DOCTYPE html>
<html lang="de" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HiBit Signage</title>
  <link rel="stylesheet" href="player.css?v={{version}}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23172000'/%3E%3Crect x='5' y='6' width='22' height='16' rx='2' fill='%23d6ff4a'/%3E%3Cpath d='M13 10l8 4-8 4z' fill='%23172000'/%3E%3C/svg%3E">
</head>
<body>
  <main id="stage">
    <div id="image-clip" hidden><img id="image" alt=""></div>
    <video id="video" hidden playsinline></video>
    <div id="web-clip" hidden><iframe id="web" title="Webseite" hidden referrerpolicy="same-origin" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-pointer-lock" allow="autoplay; fullscreen; encrypted-media"></iframe></div>
  </main>
  <section id="splash">
    <div class="brand">
      <span class="mark">HiBit</span>
      <span class="product">Signage</span>
    </div>
    <p id="splash-message">Keine Inhalte in der Warteschlange</p>
    <div id="addresses"></div>
    <p class="hint">Shell zum Debuggen: Strg + Alt + S oder Strg + Alt + F2<br>Zurück zur Anzeige: Strg + Alt + F1</p>
  </section>
  <div id="progress" hidden></div>
  <script src="player.js?v={{version}}"></script>
</body>
</html>
